name: Memorial checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e

  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Entire database service is ephemeral and CI-only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: memorial_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memorial_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: memorial_ci
      PGOPTIONS: "-c client_min_messages=warning"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Bootstrap Auth stubs (temporary database)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/M1_auth_harness.sql
      - name: Execute candidate M1 migration (temporary database)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020220618_m1_identity_tenancy.sql
      - name: Inspect RLS grants and catalog
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/M1_readonly_security_assertions.sql
      - name: Test authenticated and anonymous tenant boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/M1_cross_tenant.sql
      - name: Apply agency onboarding candidate in disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020220643_m1_agency_onboarding.sql
      - name: Isolate privileged onboarding implementation
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020220855_m1_private_agency_registration_rpc.sql
      - name: Verify exposed RPC has no elevated privileges
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/M1_rpc_privilege_assertions.sql
      - name: Test agency onboarding against role and identity restrictions
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/M1_onboarding.sql
